<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TmJunction — isoform-specific RT-PCR primers</title>
    <!-- Applied before first paint: setting the theme from React instead would render one
         frame in the wrong palette and flash on every load. -->
    <script>
      try {
        var t = localStorage.getItem("tmj.theme");
        if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
